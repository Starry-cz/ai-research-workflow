    name: The Turing Way
    name_zh: 可复现、伦理与协作式数据科研手册
    stage: [项目设计, 可复现研究, 数据管理, 协作, 沟通, 伦理]
    level: [L0, L1, L2, L3]
    type: github-handbook
    url: https://github.com/the-turing-way/the-turing-way
    summary: 提供可复现研究、项目设计、沟通、协作和伦理研究的开放手册。
    recommended_output: 按当前项目缺口形成数据、环境、版本、协作、伦理或发布检查，并链接实际证据。
    caveat: 章节覆盖范围很广，应按问题读取；开放科学建议仍需服从数据权利、机构政策和研究对象同意。
    primary_language: [multilingual]
    entry_requirement: 在线手册可直接阅读并含中文 README；多数章节不要求安装工具，具体实践会分别涉及 Git、环境、数据管理或协作平台。

  - id: openalex
    name: OpenAlex
    name_zh: 开放学术元数据与引用图谱
    stage: [论文发现, 书目核验, 引用追踪, 科研元数据自动化]
    level: [L1, L2, L3]
    type: web-and-api
    url: https://openalex.org/
    research_role: [discovery, bibliographic-record, citation-tracing, version-history]
    summary: 提供 works、authors、sources、institutions、topics 等开放学术实体和 API 查询。
    recommended_output: 保存查询条件、OpenAlex/DOI 等稳定标识、候选关系和回到原文或正式书目的核验记录。
    caveat: 覆盖、引用、作者消歧、版本和撤稿状态可能存在误差，不能作为关键书目与论文内容的唯一来源。

  - id: mlflow
    name: MLflow
    name_zh: 实验追踪与 AI 工程平台
    stage: [实验追踪, 参数指标, Artifact, 模型与 Agent 评估]
    level: [L2, L3]
    type: github-platform
    url: https://github.com/mlflow/mlflow
    summary: 记录和搜索 run 的参数、指标、代码版本、数据输入与输出 artifact，并支持模型和 AI 应用工作流。
    recommended_output: 让每个图表与结论能反向定位 run，再由 run 定位代码、配置、数据、日志和 artifact。
    caveat: 追踪平台不会自动保证实验公平、数据合规、科学解释或备份；首次小实验无需提前部署服务。
    primary_language: [en]
    entry_requirement: 本地追踪可从 Python 与本地存储开始；多人服务需数据库、artifact 存储、权限和运维，使用云端集成前核对成本与数据边界。

  - id: inspect-ai
    name: Inspect AI
    name_zh: LLM 评测框架
    stage: [LLM 评估, Agent 评估, 安全评估, 评测日志]
    level: [L2, L3]
    type: github-framework
    url: https://github.com/UKGovernmentBEIS/inspect_ai
    summary: 以 dataset、solver、scorer 和可审计日志组织 LLM 与 Agent 评测。
    recommended_output: 固定任务、模型/API、prompt、工具权限和评分器，保存原始样本、轨迹、评分与运行日志。
    caveat: 框架和预置 eval 不能证明模型安全；评测可能涉及模型费用、危险能力、敏感样本与 sandbox 权限。
    primary_language: [en]
    entry_requirement: 需 Python、模型或 API 访问和相应凭据；运行现成 eval 前仍需阅读任务、数据、评分和安全要求。

  - id: lm-evaluation-harness
    name: Language Model Evaluation Harness
    name_zh: 语言模型基准评测框架
    stage: [LLM 评估, 基准复现, 自定义任务, 多后端比较]
    level: [L2, L3]
    type: github-framework
    url: https://github.com/EleutherAI/lm-evaluation-harness
    summary: 在本地模型、推理服务和部分 API 后端上运行标准或 YAML 自定义语言模型任务。
    recommended_output: 保存框架 commit、任务 YAML、模型参数、后端、样例输出、完整分数和错误分析。
    caveat: 公共 benchmark 不等于真实任务；不同后端、提示模板、解析与版本可能改变结果，必须先做小样本核验。
    primary_language: [en]
    entry_requirement: 需 Python；不同后端另需 Torch、GPU、推理服务或 API 凭据，基础包不再默认安装全部模型后端。

  - id: ragchecker
    name: RAGChecker
    name_zh: RAG 检索与生成细粒度诊断
    stage: [RAG 评估, 检索诊断, 生成诊断, 错误分析]
    level: [L2, L3]
    type: github-framework
    url: https://github.com/amazon-science/RAGChecker
    summary: 使用 claim-level 指标分别诊断 RAG 的检索器、生成器和整体表现。
    recommended_output: 保存冻结问答集、语料与配置、模块级指标、代表性失败样例和人工核验结果。
    caveat: 自动指标依赖模型和数据假设，需要用任务人工小集校准；不能用一个综合分数替代失败定位。
    primary_language: [multilingual]
    entry_requirement: 提供英文与中文教程；运行需 Python、RAG 结果数据及框架支持的模型/凭据，开始前应先建立可解释检索 baseline。

  - id: zenodo
    name: Zenodo
    name_zh: 科研成果归档与 DOI 服务
    stage: [成果归档, 软件发布, 数据发布, DOI, 引用]
    level: [L2, L3]
    type: web-service
    url: https://zenodo.org/
    summary: 归档研究软件、数据和其他成果，并可与 GitHub release 集成生成可引用记录和 DOI。
    recommended_output: 形成冻结 release、核验后的元数据、版本 DOI、许可证与引用说明。
    caveat: 上传前必须确认公开权限、第三方材料、许可证和个人信息；归档后的正式记录不适合用覆盖方式修正历史。
