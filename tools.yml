    caveat: 输出应结合领域知识、真实证据和导师意见复核。

  - id: learning-research
    name: Learning Research
    name_zh: 科研成长与项目训练经验
    stage: [基础学习, 方向入门, 科研能力, 实验记录, 写作, 展示]
    level: [L0, L1, L2, L3]
    type: github-guide
    url: https://github.com/pengsida/learning_research
    summary: 以广度学习、深度复现和独立项目组织科研成长，并强调问题、方案、实验、写作和展示能力。
    recommended_output: 形成个人学习路线、项目周报、实验记录和阶段性研究展示。
    caveat: 部分案例和课程面向 3D Vision，应根据自己的研究方向、导师要求和资源条件调整。

  - id: autoresearchclaw
    name: AutoResearchClaw
    name_zh: 阶段化自动科研编排系统
