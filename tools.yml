# AI 科研工具库的机器可读目录。
# README.md 面向人类阅读；本文件便于后续生成网页、筛选器或统计页面。
version: 8
last_verified: "2026-08-12"
tools:
  - id: ars
    name: Academic Research Skills
    name_zh: 学术研究技能（ARS）
    stage: [选题, 调研, 写作, 审稿, 修改, 投稿]
    level: [L1, L2, L3]
    type: github-skill
    url: https://github.com/Imbad0202/academic-research-skills
    summary: 覆盖 research、write、review、revise、finalize 的完整学术研究流程。
    recommended_output: 按当前阶段选择一项技能，留下可核验的调研、写作、审查或投稿记录。
    caveat: 原项目主要面向 Claude Code，跨客户端使用前需核对兼容性。
    primary_language: [zh, en]
    entry_requirement: 阅读中文说明可直接了解方法；实际调用需安装受支持的 AI 编程客户端并配置对应模型访问，部分导出功能另需本地工具。

  - id: supervisor-skills
    name: Supervisor-Skills
    name_zh: AI 科研副导师
    stage: [选题, 研究设计, 写作, 评估, 审稿, 投稿]
    level: [L1, L2, L3]
    type: github-skill
    url: https://github.com/HKUSTDial/Supervisor-Skills
    summary: 将导师式科研经验整理为可调用的 AI 技能。
    recommended_output: 形成研究简报、假设评估、风险清单或带证据位置的修改意见。
    caveat: 输出应结合领域知识、真实证据和导师意见复核。
    primary_language: [zh]
    entry_requirement: handbook 可直接在线阅读；调用 skills 需受支持的 AI 客户端，且应先准备自己的研究材料与核验来源。

  - id: learning-research
    name: Learning Research
    name_zh: 科研成长与项目训练经验
    stage: [基础学习, 方向入门, 科研能力, 实验记录, 写作, 展示]
    level: [L0, L1, L2, L3]
    type: github-guide
    url: https://github.com/pengsida/learning_research
    summary: 以广度学习、深度复现和独立项目组织科研成长，并强调问题、方案、实验、写作和展示能力。
    recommended_output: 形成个人学习路线、项目周报、实验记录和阶段性研究展示。
    caveat: 部分案例和课程面向 3D Vision，应根据自己的研究方向、导师要求和资源条件调整。
    primary_language: [zh]
    entry_requirement: 浏览器即可阅读；要执行其中的课程、代码或项目建议，需按所选方向另行准备环境、数据与算力。

  - id: autoresearchclaw
    name: AutoResearchClaw
    name_zh: 阶段化自动科研编排系统
    stage: [研究定义, 文献, 假设, 实验设计, 实验执行, 结果分析, 写作, 归档]
    level: [L2, L3]
    type: github-framework
    url: https://github.com/aiming-lab/AutoResearchClaw
    summary: 以阶段产物、人工门控、预算约束、证据核验和版本化归档组织端到端科研流程。
    recommended_output: 将阶段产物合同、质量门控、运行清单和 PROCEED / REFINE / PIVOT 决策应用到自己的项目。
    caveat: 自动生成的文献、实验、分析和论文仍需人工核验；零基础用户应先理解手动流程，再评估是否使用自动化系统。
    primary_language: [multilingual]
    entry_requirement: 阅读多语言说明无需安装；完整运行面向已有研究与工程基础的用户，需要本地 Python、OpenClaw、模型访问和按任务配置的执行环境。

  - id: ccf-figure
    name: CCF-Figure
    name_zh: CCF 科研配图技能
    stage: [作图]
    level: [L2, L3]
    type: github-skill
    url: https://github.com/Deepshare-Official/CCF-Figure
    summary: 根据论文类型规划 AI / CS 论文的科研配图结构和提示词。
    recommended_output: 形成变量关系明确、来源可追踪且保留可编辑源文件的论文图。
    caveat: 生成结果需要人工检查并建议使用矢量工具精修。
    primary_language: [zh, en]
    entry_requirement: 阅读模板可直接开始；作为 skill 使用需 Claude Code 或 Codex，真正生成图片还需要可用的图像模型或后续绘图工具。

  - id: cosmos-paper
    name: CosmosPaper
    name_zh: CosmosPaper
    stage: [论文发现]
    level: [L1, L2, L3]
    type: github-and-web
    url: https://github.com/ulairii/cosmospaper
    web_url: https://www.cosmospapers.com/
    research_role: [discovery, venue-index]
    summary: 聚合部分 AI、机器学习、视觉、图形与安全会议论文，提供筛选、语义搜索和趋势入口。
    recommended_output: 建立带原文链接、筛选理由和待核验项的小型候选论文集合。
    caveat: 项目当前声明覆盖 15+ 会议与 2022–2026 年论文，不代表全部 AI / CS venue；AI 摘要与 BibTeX 应回到 DOI 或原文核验，并留意自带 API key 的数据条款。

